dictname: embedded
initlist:
  Crypto:
    cfg:
      cryptoProcess: '{"timingcode": {}, "directprefix": ["encrypt", "decrypt"], "trace":
        "0", "msg2mc": {}, "groups": []}'
    cptype: Crypto
    msgs: []
    name: Crypto
    useyaml: true
  Embedded:
    cfg:
      embeddedProcess: '{"timingcode": {"process": "packet-process"}, "accelname":
        "", "trace": "0", "msg2mc": {}, "msg2msg": {}, "group": []}'
      reqDecrypt: '{"bypass": "0", "trace": "0", "srvCP": "Crypto", "srvLabel": "cryptoProcess",
        "srvOp": "decrypt-$crypto", "rspOp": "", "msg2mc": {"*": "default"}, "msg2msg":
        {}, "groups": []}'
      reqEncrypt: '{"bypass": "0", "trace": "0", "srvCP": "Crypto", "srvLabel": "cryptoProcess",
        "srvOp": "encrypt-$crypto", "rspOp": "", "msg2mc": {"*": "default"}, "msg2msg":
        {}, "groups": []}'
      validateSrc: '{"bypass": "$zerotrust", "trace": "0", "srvCP": "", "srvLabel":
        "", "srvOp": "auth", "rspOp": "", "msg2mc": {"*": "default"}, "msg2msg": {},
        "groups": []}'
    cptype: Embedded
    msgs:
    - ispckt: true
      msgtype: decrypt
    - ispckt: true
      msgtype: process
    - ispckt: true
      msgtype: encrypt
    - ispckt: true
      msgtype: results
    name: Embedded
    useyaml: true
  EmbeddedAuth:
    cfg:
      authenticate: '{"timingcode": {"auth": "authenticate"}, "directprefix": [],
        "trace": "0", "msg2mc": {"*": "default"}, "groups": []}'
    cptype: EmbeddedAuth
    msgs: []
    name: EmbeddedAuth
    useyaml: true
  HMI:
    cfg:
      accelDecrypt: '{"timingcode": {"decrypt": "decrypt-$crypto"}, "accelname": "hmiAccel",
        "trace": "1", "msg2mc": {}, "msg2msg": {}, "group": []}'
      accelEncrypt: '{"timingcode": {"encrypt": "encrypt-$crypto"}, "accelname": "hmiAccel",
        "trace": "1", "msg2mc": {}, "msg2msg": {}, "group": []}'
      endMeasure: '{"msrname": "end2end", "msrop": "end", "trace": "0", "msg2mc":
        {}, "groups": []}'
      endThread: '{"trace": "0", "msg2mc": {"finish": "default"}, "data": "", "groups":
        []}'
      generatePckt: '{"timingcode": {"generate": "packet-generation"}, "accelname":
        "", "trace": "1", "msg2mc": {}, "msg2msg": {}, "group": []}'
      processRtn: '{"timingcode": {"process": "packet-return"}, "accelname": "", "trace":
        "0", "msg2mc": {}, "msg2msg": {}, "group": []}'
      startMeasure: '{"msrname": "end2end", "msrop": "start", "trace": "0", "msg2mc":
        {}, "groups": []}'
      startThread: '{"pcktlen": "1000", "msglen": "1500", "msgtype": "measure", "starttime":
        "10", "data": "$lambda", "groups": [], "trace": "0"}'
      validateSrc: '{"bypass": "$zerotrust", "trace": "0", "srvCP": "", "srvLabel":
        "", "srvOp": "auth", "rspOp": "", "msg2mc": {"*": "default"}, "msg2msg": {},
        "groups": []}'
    cptype: HMI
    msgs:
    - ispckt: true
      msgtype: measure
    - ispckt: true
      msgtype: generate
    - ispckt: true
      msgtype: encrypt
    - ispckt: true
      msgtype: decrypt
    - ispckt: true
      msgtype: process
    - ispckt: true
      msgtype: finish
    - ispckt: true
      msgtype: compute
    name: HMI
    useyaml: true
  HMIAuth:
    cfg:
      authenticate: '{"timingcode": {"auth": "authenticate"}, "directprefix": [],
        "trace": "0", "msg2mc": {"*": "default"}, "groups": []}'
    cptype: HMIAuth
    msgs: []
    name: HMIAuth
    useyaml: true
